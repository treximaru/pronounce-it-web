<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pronounce It! — English Dictionary</title>
<style>
  :root { --bg:#f7f7f8; --card:#fff; --ink:#1a1a1a; --muted:#6b7280;
          --accent:#1a73e8; --line:#e5e7eb; --ipa:#0b8043; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121214; --card:#1c1c1f; --ink:#e8e8e8; --muted:#9aa0a6;
            --accent:#8ab4f8; --line:#2e2e33; --ipa:#7bd88f; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--ink); }
  header { position:sticky; top:0; z-index:10; background:var(--card);
           border-bottom:1px solid var(--line); padding:12px 16px; }
  header h1 { margin:0 0 2px; font-size:20px; }
  header h1 span { color:var(--accent); }
  header p { margin:0 0 10px; font-size:12px; color:var(--muted); }
  #q { width:100%; font-size:17px; padding:11px 14px; border-radius:12px;
       border:1px solid var(--line); background:var(--bg); color:var(--ink);
       outline:none; }
  #q:focus { border-color:var(--accent); }
  main { max-width:720px; margin:0 auto; padding:12px 16px 60px; }
  .res { display:flex; justify-content:space-between; align-items:baseline; gap:8px;
         padding:11px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  .res:hover { background:var(--card); }
  .res .w { font-size:17px; font-weight:600; }
  .res .g { font-size:13px; color:var(--muted); white-space:nowrap;
            overflow:hidden; text-overflow:ellipsis; max-width:45%; }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }
  #detail { display:none; background:var(--card); border:1px solid var(--line);
            border-radius:14px; padding:18px; margin-bottom:14px; }
  #detail .word { font-size:30px; font-weight:700; }
  #detail .pos { color:var(--muted); font-style:italic; margin-left:8px; font-size:15px; }
  #detail .ipa { font-size:22px; color:var(--ipa); margin:10px 0 4px;
                 font-family:"Segoe UI",system-ui,sans-serif; }
  .speakrow { display:flex; gap:8px; margin:8px 0 4px; }
  .speakrow button { flex:1; font-size:15px; padding:10px; border-radius:10px;
    border:1px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer; }
  .speakrow button:active { background:var(--line); }
  .syl { font-size:19px; margin:10px 0; letter-spacing:1px; }
  .syl b { color:var(--accent); }
  .lbl { font-size:12px; text-transform:uppercase; letter-spacing:.6px;
         color:var(--muted); margin:12px 0 4px; }
  .gloss { font-size:18px; }
  .ex { font-size:15px; color:var(--muted); font-style:italic; }
  .chips { font-size:14px; }
  #back { display:none; margin-bottom:10px; font-size:14px; color:var(--accent);
          background:none; border:none; cursor:pointer; padding:4px 0; }
  footer { text-align:center; font-size:12px; color:var(--muted); padding:24px 0; }
  footer .src { font-size:11px; margin-top:6px; }
</style>
</head>
<body>
<header>
  <h1>Pronounce <span>It!</span></h1>
  <p>English Dictionary &mdash; tap a word, tap the speaker to hear it</p>
  <input id="q" type="search" placeholder="Search 91,556 words…" autocomplete="off" autocapitalize="off" spellcheck="false">
</header>
<main>
  <button id="back">&larr; Back to results</button>
  <div id="detail"></div>
  <div id="results"></div>
  <footer>
    <div id="stats"></div>
    <div class="src">IPA &amp; syllables: Wiktionary/Kaikki, CMUdict &middot; Audio: your browser's speech engine (UK English)</div>
  </footer>
</main>
<script>
"use strict";
const $ = s => document.querySelector(s);
const q = $("#q"), resultsEl = $("#results"), detailEl = $("#detail"), backBtn = $("#back");
let lastQuery = "";

/* ---------- speech ---------- */
let voice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  if (!vs.length) return;
  voice = vs.find(v => v.lang === "en-GB" && /google uk english female/i.test(v.name))
       || vs.find(v => v.lang === "en-GB" && /female/i.test(v.name))
       || vs.find(v => v.lang === "en-GB")
       || vs.find(v => v.lang && v.lang.toLowerCase().startsWith("en"));
}
if ("speechSynthesis" in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text, rate) {
  if (!("speechSynthesis" in window)) { alert("Speech not supported in this browser."); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-GB";
  if (voice) u.voice = voice;
  u.rate = rate;
  speechSynthesis.speak(u);
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function syllablesHtml(w) {
  if (!w.syllables) return "";
  const parts = w.syllables.split("·");
  const idx = (w.stress_index || 1) - 1;
  return `<div class="lbl">Syllables</div><div class="syl">` +
    parts.map((p, i) => i === idx ? `<b>${esc(p)}</b>` : esc(p)).join(" &middot; ") + `</div>`;
}

function showDetail(w) {
  detailEl.style.display = "block";
  backBtn.style.display = "block";
  const syn = w.synonyms ? `<div class="lbl">Synonyms</div><div class="chips">${esc(w.synonyms)}</div>` : "";
  const ant = w.antonyms ? `<div class="lbl">Antonyms</div><div class="chips">${esc(w.antonyms)}</div>` : "";
  const ex  = w.example ? `<div class="lbl">Example</div><div class="ex">&ldquo;${esc(w.example)}&rdquo;</div>` : "";
  detailEl.innerHTML =
    `<div><span class="word">${esc(w.word)}</span><span class="pos">${esc(w.pos || "")}</span></div>` +
    (w.ipa_uk ? `<div class="ipa">/${esc(w.ipa_uk)}/</div>` : "") +
    `<div class="speakrow">
       <button data-say="1">🔊 Listen</button>
       <button data-say="0.65">🐢 Slow</button>
     </div>` +
    syllablesHtml(w) +
    (w.gloss_id ? `<div class="lbl">Arti (Indonesia)</div><div class="gloss">${esc(w.gloss_id)}</div>` : "") +
    (w.definition_en ? `<div class="lbl">Definition</div><div>${esc(w.definition_en)}</div>` : "") +
    syn + ant + ex;
  detailEl.querySelectorAll("[data-say]").forEach(b =>
    b.addEventListener("click", () => speak(w.word, parseFloat(b.dataset.say))));
  resultsEl.style.display = "none";
  window.scrollTo(0, 0);
}

function showResults(list) {
  detailEl.style.display = "none";
  backBtn.style.display = "none";
  resultsEl.style.display = "block";
  if (!list.length) {
    resultsEl.innerHTML = `<div class="empty">No results for &ldquo;${esc(lastQuery)}&rdquo;.</div>`;
    return;
  }
  resultsEl.innerHTML = list.map(w =>
    `<div class="res" data-w="${esc(w.word)}">
       <span class="w">${esc(w.word)}</span>
       <span class="g">${esc(w.gloss_id || w.ipa_uk || "")}</span>
     </div>`).join("");
  resultsEl.querySelectorAll(".res").forEach(el =>
    el.addEventListener("click", async () => {
      const r = await fetch("/api/word/" + encodeURIComponent(el.dataset.w));
      if (r.ok) showDetail(await r.json());
    }));
}

let t = null;
async function doSearch() {
  lastQuery = q.value;
  const r = await fetch("/api/search?q=" + encodeURIComponent(lastQuery));
  if (r.ok) showResults(await r.json());
}
q.addEventListener("input", () => { clearTimeout(t); t = setTimeout(doSearch, 200); });
q.addEventListener("keydown", async e => {
  if (e.key === "Enter" && lastQuery.trim()) {
    const r = await fetch("/api/word/" + encodeURIComponent(lastQuery.trim()));
    if (r.ok) showDetail(await r.json());
  }
});
backBtn.addEventListener("click", () => doSearch());

fetch("/api/stats").then(r => r.json()).then(s =>
  $("#stats").textContent =
    `${s.words.toLocaleString("en-US")} words · ${s.glossed.toLocaleString("en-US")} with Indonesian meaning`);

doSearch();
</script>
</body>
</html>
